- id: chauffage_application_planning
  alias: Chauffage - planning, absence et dérogations
  mode: single
  max_exceeded: silent
  trigger:
  - platform: state
    entity_id:
    - input_boolean.chauffage_autorise
    - input_boolean.chauffage_configuration_initialisee
    - input_boolean.chauffage_profils_initialises
    - input_boolean.chauffage_absent
    - input_select.chauffage_planning
    - schedule.chauffage_habituel
    - schedule.chauffage_teletravail
    - schedule.chauffage_vacances_maison
    - input_number.chauffage_salon_confort
    - input_number.chauffage_salon_eco
    - input_number.chauffage_salon_nuit
    - input_number.chauffage_salon_absent
    - input_number.chauffage_salon_cible
    - input_number.chauffage_cuisine_confort
    - input_number.chauffage_cuisine_eco
    - input_number.chauffage_cuisine_nuit
    - input_number.chauffage_cuisine_absent
    - input_number.chauffage_cuisine_cible
    - input_number.chauffage_chambre_1_confort
    - input_number.chauffage_chambre_1_eco
    - input_number.chauffage_chambre_1_nuit
    - input_number.chauffage_chambre_1_absent
    - input_number.chauffage_chambre_1_cible
    - input_number.chauffage_chambre_2_confort
    - input_number.chauffage_chambre_2_eco
    - input_number.chauffage_chambre_2_nuit
    - input_number.chauffage_chambre_2_absent
    - input_number.chauffage_chambre_2_cible
    - input_number.chauffage_chambre_3_confort
    - input_number.chauffage_chambre_3_eco
    - input_number.chauffage_chambre_3_nuit
    - input_number.chauffage_chambre_3_absent
    - input_number.chauffage_chambre_3_cible
    - input_number.chauffage_bureau_confort
    - input_number.chauffage_bureau_eco
    - input_number.chauffage_bureau_nuit
    - input_number.chauffage_bureau_absent
    - input_number.chauffage_bureau_cible
    - input_number.chauffage_entree_confort
    - input_number.chauffage_entree_eco
    - input_number.chauffage_entree_nuit
    - input_number.chauffage_entree_absent
    - input_number.chauffage_entree_cible
    - input_number.chauffage_piece_8_confort
    - input_number.chauffage_piece_8_eco
    - input_number.chauffage_piece_8_nuit
    - input_number.chauffage_piece_8_absent
    - input_number.chauffage_piece_8_cible
    - input_select.chauffage_salon_mode
    - input_select.chauffage_cuisine_mode
    - input_select.chauffage_chambre_1_mode
    - input_select.chauffage_chambre_2_mode
    - input_select.chauffage_chambre_3_mode
    - input_select.chauffage_bureau_mode
    - input_select.chauffage_entree_mode
    - input_select.chauffage_piece_8_mode
    - input_datetime.chauffage_salon_fin
    - input_datetime.chauffage_cuisine_fin
    - input_datetime.chauffage_chambre_1_fin
    - input_datetime.chauffage_chambre_2_fin
    - input_datetime.chauffage_chambre_3_fin
    - input_datetime.chauffage_bureau_fin
    - input_datetime.chauffage_entree_fin
    - input_datetime.chauffage_piece_8_fin
  - platform: homeassistant
    event: start
  - platform: time_pattern
    seconds: /15
  condition:
  - condition: state
    entity_id: input_boolean.chauffage_autorise
    state: 'on'
  - condition: state
    entity_id: input_boolean.chauffage_configuration_initialisee
    state: 'on'
  - condition: state
    entity_id: input_boolean.chauffage_profils_initialises
    state: 'on'
  - condition: template
    value_template: '{{ states(''input_boolean.chauffage_absent'') in [''on'',''off''] }}'
  action:
  - variables:
      valve_map:
        salon: climate.trv_salon
        cuisine: climate.trv_cuisine
        chambre_1: climate.trv_chambre_1
        chambre_2: climate.trv_chambre_2
        chambre_3: climate.trv_chambre_3
        bureau: climate.trv_bureau
        entree: climate.trv_entree
        piece_8: climate.trv_piece_8
      planning_map:
        Habituel: schedule.chauffage_habituel
        Télétravail: schedule.chauffage_teletravail
        Vacances à la maison: schedule.chauffage_vacances_maison
      planning: '{{ planning_map.get(states(''input_select.chauffage_planning''), '''') }}'
      absent: '{{ is_state(''input_boolean.chauffage_absent'', ''on'') }}'
      tick: '{{ as_timestamp(now()) }}'
  - repeat:
      for_each:
      - salon
      - cuisine
      - chambre_1
      - chambre_2
      - chambre_3
      - bureau
      - entree
      - piece_8
      sequence:
      - variables:
          vanne: '{{ valve_map[repeat.item] }}'
          consigne: "{% set modes = {'Confort':'confort', 'Éco':'eco', 'Nuit':'nuit', 'Absent':'absent'} %}\n{%\
            \ set mode = states('input_select.chauffage_' ~ repeat.item ~ '_mode') %}\n{% if absent %}\n  {{ states('input_number.chauffage_'\
            \ ~ repeat.item ~ '_absent') | float(-1) }}\n{% elif mode in modes %}\n  {{ states('input_number.chauffage_'\
            \ ~ repeat.item ~ '_' ~ modes[mode]) | float(-1) }}\n{% elif mode != 'Planning' %} -1\n{% elif as_timestamp(states('input_datetime.chauffage_'\
            \ ~ repeat.item ~ '_fin'), 0) > tick | float %}\n  {{ states('input_number.chauffage_' ~ repeat.item\
            \ ~ '_cible') | float(-1) }}\n{% elif is_state(planning, 'on') %}\n  {% set profil = state_attr(planning,\
            \ 'profil') | default('confort', true) %}\n  {{ states('input_number.chauffage_' ~ repeat.item ~ '_'\
            \ ~ profil) | float(-1) if profil in ['confort','eco','nuit','absent'] else -1 }}\n{% elif is_state(planning,\
            \ 'off') %}\n  {{ states('input_number.chauffage_' ~ repeat.item ~ '_eco') | float(-1) }}\n{% else %}\
            \ -1 {% endif %}"
      - if:
        - condition: template
          value_template: '{{ states(vanne) not in [''unknown'',''unavailable''] and 5 <= consigne | float(-1) <=
            25 }}'
        then:
        - if:
          - condition: template
            value_template: '{{ not is_state(vanne, ''heat'') }}'
          then:
          - service: climate.set_hvac_mode
            target:
              entity_id: '{{ vanne }}'
            data:
              hvac_mode: heat
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ state_attr(vanne, ''temperature'') | float(-1) != consigne | float }}'
          then:
          - service: climate.set_temperature
            target:
              entity_id: '{{ vanne }}'
            data:
              temperature: '{{ consigne }}'
            continue_on_error: true
