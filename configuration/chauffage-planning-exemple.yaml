script:
  chauffage_initialiser:
    alias: Chauffage - initialiser une seule fois
    mode: single
    sequence:
    - condition: state
      entity_id: input_boolean.chauffage_autorise
      state: 'off'
    - condition: state
      entity_id: input_boolean.chauffage_configuration_initialisee
      state: 'off'
    - service: input_number.set_value
      target:
        entity_id:
        - input_number.chauffage_salon_confort
        - input_number.chauffage_cuisine_confort
        - input_number.chauffage_chambre_1_confort
        - input_number.chauffage_chambre_2_confort
        - input_number.chauffage_chambre_3_confort
        - input_number.chauffage_bureau_confort
        - input_number.chauffage_entree_confort
        - input_number.chauffage_piece_8_confort
      data:
        value: 20
    - service: input_number.set_value
      target:
        entity_id:
        - input_number.chauffage_salon_eco
        - input_number.chauffage_cuisine_eco
        - input_number.chauffage_chambre_1_eco
        - input_number.chauffage_chambre_2_eco
        - input_number.chauffage_chambre_3_eco
        - input_number.chauffage_bureau_eco
        - input_number.chauffage_entree_eco
        - input_number.chauffage_piece_8_eco
      data:
        value: 17
    - service: input_number.set_value
      target:
        entity_id:
        - input_number.chauffage_salon_nuit
        - input_number.chauffage_cuisine_nuit
        - input_number.chauffage_chambre_1_nuit
        - input_number.chauffage_chambre_2_nuit
        - input_number.chauffage_chambre_3_nuit
        - input_number.chauffage_bureau_nuit
        - input_number.chauffage_entree_nuit
        - input_number.chauffage_piece_8_nuit
      data:
        value: 17
    - service: input_number.set_value
      target:
        entity_id:
        - input_number.chauffage_salon_absent
        - input_number.chauffage_cuisine_absent
        - input_number.chauffage_chambre_1_absent
        - input_number.chauffage_chambre_2_absent
        - input_number.chauffage_chambre_3_absent
        - input_number.chauffage_bureau_absent
        - input_number.chauffage_entree_absent
        - input_number.chauffage_piece_8_absent
      data:
        value: 14
    - service: input_number.set_value
      target:
        entity_id:
        - input_number.chauffage_salon_manuel
        - input_number.chauffage_cuisine_manuel
        - input_number.chauffage_chambre_1_manuel
        - input_number.chauffage_chambre_2_manuel
        - input_number.chauffage_chambre_3_manuel
        - input_number.chauffage_bureau_manuel
        - input_number.chauffage_entree_manuel
        - input_number.chauffage_piece_8_manuel
      data:
        value: 20
    - service: input_number.set_value
      target:
        entity_id:
        - input_number.chauffage_salon_cible
        - input_number.chauffage_cuisine_cible
        - input_number.chauffage_chambre_1_cible
        - input_number.chauffage_chambre_2_cible
        - input_number.chauffage_chambre_3_cible
        - input_number.chauffage_bureau_cible
        - input_number.chauffage_entree_cible
        - input_number.chauffage_piece_8_cible
      data:
        value: 20
    - service: input_number.set_value
      target:
        entity_id: input_number.chauffage_duree_manuelle
      data:
        value: 3
    - &id001
      service: input_datetime.set_datetime
      target:
        entity_id:
        - input_datetime.chauffage_salon_fin
        - input_datetime.chauffage_cuisine_fin
        - input_datetime.chauffage_chambre_1_fin
        - input_datetime.chauffage_chambre_2_fin
        - input_datetime.chauffage_chambre_3_fin
        - input_datetime.chauffage_bureau_fin
        - input_datetime.chauffage_entree_fin
        - input_datetime.chauffage_piece_8_fin
      data:
        datetime: '2000-01-01 00:00:00'
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.chauffage_absent
    - service: input_select.select_option
      target:
        entity_id:
        - input_select.chauffage_salon_mode
        - input_select.chauffage_cuisine_mode
        - input_select.chauffage_chambre_1_mode
        - input_select.chauffage_chambre_2_mode
        - input_select.chauffage_chambre_3_mode
        - input_select.chauffage_bureau_mode
        - input_select.chauffage_entree_mode
        - input_select.chauffage_piece_8_mode
      data:
        option: Planning
    - service: input_boolean.turn_on
      target:
        entity_id:
        - input_boolean.chauffage_configuration_initialisee
        - input_boolean.chauffage_profils_initialises
  chauffage_initialiser_nouveaux_profils:
    alias: Chauffage - initialiser Nuit et Absent sans changer Confort et Éco
    mode: single
    sequence:
    - condition: state
      entity_id: input_boolean.chauffage_autorise
      state: 'off'
    - condition: state
      entity_id: input_boolean.chauffage_configuration_initialisee
      state: 'on'
    - condition: state
      entity_id: input_boolean.chauffage_profils_initialises
      state: 'off'
    - service: input_number.set_value
      target:
        entity_id:
        - input_number.chauffage_salon_nuit
        - input_number.chauffage_cuisine_nuit
        - input_number.chauffage_chambre_1_nuit
        - input_number.chauffage_chambre_2_nuit
        - input_number.chauffage_chambre_3_nuit
        - input_number.chauffage_bureau_nuit
        - input_number.chauffage_entree_nuit
        - input_number.chauffage_piece_8_nuit
      data:
        value: 17
    - service: input_number.set_value
      target:
        entity_id:
        - input_number.chauffage_salon_absent
        - input_number.chauffage_cuisine_absent
        - input_number.chauffage_chambre_1_absent
        - input_number.chauffage_chambre_2_absent
        - input_number.chauffage_chambre_3_absent
        - input_number.chauffage_bureau_absent
        - input_number.chauffage_entree_absent
        - input_number.chauffage_piece_8_absent
      data:
        value: 14
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.chauffage_profils_initialises
  chauffage_basculer_absence:
    alias: Chauffage - Absent / retour
    mode: single
    sequence:
    - *id001
    - service: input_boolean.toggle
      target:
        entity_id: input_boolean.chauffage_absent
  chauffage_annuler_derogations:
    alias: Chauffage - reprendre le planning partout
    mode: single
    sequence:
    - *id001
  chauffage_salon_appliquer:
    alias: Salon - appliquer la consigne temporaire
    mode: restart
    sequence:
    - condition: state
      entity_id: input_boolean.chauffage_autorise
      state: 'on'
    - condition: state
      entity_id: input_boolean.chauffage_configuration_initialisee
      state: 'on'
    - condition: state
      entity_id: input_boolean.chauffage_absent
      state: 'off'
    - condition: state
      entity_id: input_select.chauffage_salon_mode
      state: Planning
    - condition: state
      entity_id: input_boolean.chauffage_profils_initialises
      state: 'on'
    - condition: template
      value_template: '{{ 5 <= states(''input_number.chauffage_salon_manuel'') | float(-1) <= 25 and 0.5 <= states(''input_number.chauffage_duree_manuelle'')
        | float(-1) <= 12 }}'
    - service: input_number.set_value
      target:
        entity_id: input_number.chauffage_salon_cible
      data:
        value: '{{ states(''input_number.chauffage_salon_manuel'') | float }}'
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.chauffage_salon_fin
      data:
        timestamp: '{{ as_timestamp(now()) + states(''input_number.chauffage_duree_manuelle'') | float * 3600 }}'
  chauffage_salon_planning:
    alias: Salon - reprendre le planning
    mode: single
    sequence:
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.chauffage_salon_fin
      data:
        datetime: '2000-01-01 00:00:00'
    - service: input_select.select_option
      target:
        entity_id: input_select.chauffage_salon_mode
      data:
        option: Planning
  chauffage_cuisine_appliquer:
    alias: Cuisine - appliquer la consigne temporaire
    mode: restart
    sequence:
    - condition: state
      entity_id: input_boolean.chauffage_autorise
      state: 'on'
    - condition: state
